name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node packages/core/dist/cli.js drawdown --balance 50000 --max-dd 2000 --peak 51000 --equity 50500 --json
      - run: node packages/core/dist/cli.js import packages/core/samples/tradovate-fills.csv
