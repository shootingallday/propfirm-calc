name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - id: published
        run: echo "done=$(npm view propfirm-calc@$(node -p "require('./packages/core/package.json').version") version >/dev/null 2>&1 && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.done == 'no'
        run: pnpm install --frozen-lockfile
      - if: steps.published.outputs.done == 'no'
        run: pnpm test
      - if: steps.published.outputs.done == 'no'
        run: pnpm --filter propfirm-calc build
      - if: steps.published.outputs.done == 'no'
        run: pnpm --filter propfirm-calc publish --access public --no-git-checks --provenance
