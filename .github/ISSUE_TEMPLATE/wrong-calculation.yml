name: Wrong calculation
description: A result disagrees with what a prop firm actually did to an account
labels: ["bug", "math"]
body:
  - type: markdown
    attributes:
      value: >
        This is the most useful kind of report. The account numbers matter more
        than the description — with them the disagreement is reproducible in one
        line.

  - type: input
    id: call
    attributes:
      label: The call you made
      description: The exact CLI command or function call, or the account you set up in the app.
      placeholder: propfirm-calc drawdown --balance 50000 --max-dd 2000 --peak 51000
    validations:
      required: true

  - type: input
    id: got
    attributes:
      label: What it returned
      placeholder: "Floor $49,000.00"
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: What the firm's platform showed
      placeholder: "49500.00 on the account dashboard"
    validations:
      required: true

  - type: textarea
    id: account
    attributes:
      label: Account details
      description: >
        Starting balance, max loss limit, drawdown type (trailing, EOD trailing,
        static), peak equity and current equity. Firm name helps if you're happy
        to share it.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: propfirm-calc version
      placeholder: "0.2.0"
    validations:
      required: true
