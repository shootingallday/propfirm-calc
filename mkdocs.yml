site_name: propfirm-calc
site_description: Tiny, dependency-free math and CLI for funded-trader (prop firm) futures accounts.
site_url: https://shootingallday.github.io/propfirm-calc/
repo_url: https://github.com/shootingallday/propfirm-calc
repo_name: shootingallday/propfirm-calc
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Overview: index.md
  - CLI: cli.md
  - API reference: reference.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shootingallday/propfirm-calc
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/propfirm-calc/
