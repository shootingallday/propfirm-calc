[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "propfirm-calc"
version = "0.2.0"
description = "Tiny, dependency-free math for funded-trader (prop firm) futures accounts: trailing drawdown, consistency rule, payout eligibility, sizing and projection."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "shootingallday" }]
keywords = [
    "trading",
    "futures",
    "prop-firm",
    "funded-trader",
    "drawdown",
    "position-sizing",
    "topstep",
    "apex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
    "Environment :: Console",
]
dependencies = []

[project.scripts]
propfirm-calc = "propfirm_calc.cli:main"

[project.urls]
Homepage = "https://github.com/shootingallday/propfirm-calc"
Repository = "https://github.com/shootingallday/propfirm-calc"
Issues = "https://github.com/shootingallday/propfirm-calc/issues"
Changelog = "https://github.com/shootingallday/propfirm-calc/blob/main/CHANGELOG.md"
Documentation = "https://shootingallday.github.io/propfirm-calc/"

[project.optional-dependencies]
tui = ["rich>=13"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff==0.16.6", "mypy>=1.8", "rich>=13"]
docs = ["mkdocs-material>=9.7", "mkdocstrings[python]>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/propfirm_calc"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff.format]
exclude = ["*.md"]
