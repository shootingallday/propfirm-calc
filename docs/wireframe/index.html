<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accounts · propfirm-calc</title>
<link rel="icon" href="../../apps/web/public/icon.png">
<link rel="stylesheet" href="px/tokens.css">
<link rel="stylesheet" href="px/components.css">
<link rel="stylesheet" href="px/chart.css">
<style>
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--px-font-sans);font-size:var(--text-body);line-height:var(--leading-body)}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:var(--z-sticky);display:flex;align-items:center;gap:var(--px-space-4);padding:var(--px-space-3) var(--gutter);background:var(--background);border-block-end:1px solid var(--border)}
.wordmark{display:flex;align-items:center;gap:var(--px-space-2);font-weight:650;color:var(--foreground);text-decoration:none}
.wordmark img{inline-size:24px;block-size:24px;border-radius:var(--px-radius-sm)}
.bar .px-nav{background:none;border:0;box-shadow:none;padding:0}
.bar-end{margin-inline-start:auto;display:flex;align-items:center;gap:var(--px-space-2)}
main{display:block;padding:var(--px-space-6) var(--gutter) var(--px-space-16);max-inline-size:1440px;margin-inline:auto}
main:focus{outline:none}
.foot{display:flex;flex-wrap:wrap;gap:var(--px-space-4);padding:var(--px-space-6) var(--gutter) var(--px-space-24);border-block-start:1px solid var(--border);color:var(--muted-foreground);font-size:var(--px-text-sm)}
.foot a{color:var(--link)}
.foot .end{margin-inline-start:auto}
.stack{display:grid;gap:var(--stack-gap)}
.row{display:flex;align-items:center;gap:var(--px-space-2);flex-wrap:wrap}
.muted{color:var(--muted-foreground)}
.small{font-size:var(--px-text-sm)}
.desk{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--card-gap);align-items:start}
.desk.open{grid-template-columns:minmax(0,1fr) 460px}
.whatif{display:grid;grid-template-columns:auto minmax(160px,1fr) auto auto;align-items:center;gap:var(--px-space-4);padding:var(--px-space-3) var(--cell-px)}
.whatif .x{font-size:var(--px-text-xl);font-weight:650;min-inline-size:7ch;white-space:nowrap}
.whatif .px-slider{min-inline-size:0}
.acct-table{overflow-x:auto}
.acct-table tr[data-id]{cursor:pointer}
.acct-table tr[aria-selected="true"] td{background:var(--accent)}
.acct-name{font-weight:600}
.acct-sub{font-size:var(--px-text-sm);color:var(--muted-foreground)}
.room{display:grid;gap:6px;min-inline-size:140px}
.room .px-meter{inline-size:100%}
.fx{display:flex;flex-wrap:wrap;gap:4px;margin-block-start:6px}
.panel{padding:var(--px-space-4) var(--cell-px);display:grid;gap:var(--stack-gap)}
.panel-top{display:flex;align-items:center;gap:var(--px-space-2)}
.panel-top h2{font-size:var(--px-text-xl);font-weight:650;letter-spacing:var(--px-tracking-tight);outline:none}
.panel-top h2[contenteditable="plaintext-only"]{box-shadow:var(--focus-ring);border-radius:var(--px-radius-sm);padding-inline:4px}
.next-line{font-size:var(--px-text-md);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--px-space-2)}
.stats .px-stat{padding:var(--px-space-3)}
.stats .px-stat-value{font-size:var(--px-text-lg);white-space:nowrap}
.tabpad{padding-block-start:var(--px-space-4);display:grid;gap:var(--stack-gap)}
.path{display:grid;gap:var(--px-space-2)}
.path-head{display:flex;align-items:center;justify-content:space-between;gap:var(--px-space-2)}
.path ul{margin:0;padding-inline-start:18px;color:var(--muted-foreground);font-size:var(--px-text-sm)}
.inline-form{display:grid;grid-template-columns:1fr 1fr auto;gap:var(--px-space-2);align-items:end}
.px-chart-plot{block-size:180px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--px-space-4);margin-block-end:var(--stack-gap)}
.page-head h1{font-size:var(--px-text-2xl);font-weight:650;letter-spacing:var(--px-tracking-tight)}
.page-head p{color:var(--muted-foreground);margin-block-start:4px}
.narrow{max-inline-size:880px;margin-inline:auto}
.week{display:grid;grid-template-columns:160px 1fr auto;gap:var(--px-space-4);padding:var(--px-space-3) var(--cell-px);border-block-end:1px solid var(--border)}
.week:last-child{border-block-end:0}
.event{display:flex;gap:var(--px-space-3);align-items:baseline}
.event time{inline-size:52px;flex:none;color:var(--muted-foreground);font-size:var(--px-text-sm)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--card-gap)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--px-space-3)}
.tabbar,.fab{display:none}
.left-out td:not(:first-child){color:var(--muted-foreground)}
@media (max-width:1279px){.desk.open{grid-template-columns:minmax(0,1fr) 400px}}
@media (max-width:1023px){
 .desk.open{grid-template-columns:minmax(0,1fr)}
 .panel{position:fixed;inset:0;overflow:auto;overscroll-behavior:contain;z-index:var(--z-overlay);border-radius:0;padding-block-end:var(--px-space-24)}
 .col-best{display:none}
}
@media (max-width:767px){.col-profit,.col-balance{display:none}.whatif{grid-template-columns:1fr auto}.whatif .px-slider{grid-column:1/-1;grid-row:2}.grid2,.fields{grid-template-columns:1fr}.week{grid-template-columns:1fr}}
@media (max-width:639px){
 .bar .px-nav,.bar .add-top{display:none}
 .tabbar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:var(--z-sticky);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));background:var(--card);border-block-start:1px solid var(--border)}
 .tabbar a{display:grid;justify-items:center;gap:2px;min-block-size:var(--control-h-lg);min-inline-size:64px;font-size:var(--px-text-xs);color:var(--muted-foreground);text-decoration:none}
 .tabbar a[aria-current="page"]{color:var(--foreground);font-weight:600}
 .fab{display:inline-flex;position:fixed;inset-inline-end:var(--gutter);bottom:calc(76px + env(safe-area-inset-bottom));z-index:var(--z-sticky);box-shadow:var(--shadow-lg)}
 .stats{grid-template-columns:1fr 1fr}
 .inline-form{grid-template-columns:1fr 1fr}.inline-form .px-btn{grid-column:1/-1}
}
</style>
</head>
<body>
<a class="px-skip-link" href="#main">Skip to content</a>
<header class="bar">
 <a class="wordmark" href="#accounts"><img src="../../apps/web/public/icon.png" alt="">propfirm-calc</a>
 <nav class="px-nav" aria-label="Primary" id="nav"></nav>
 <div class="bar-end">
  <button class="px-btn" data-variant="ghost" data-size="icon" id="theme" aria-label="Switch to dark mode"><px-icon name="dark"></px-icon></button>
  <button class="px-btn add-top" data-variant="primary" data-add><px-icon name="add"></px-icon>Add account</button>
 </div>
</header>
<main id="main" tabindex="-1"></main>
<footer class="foot"><span>Firm rules checked up to Sep 29, 2026</span><span>Your data stays in this browser</span><a href="https://github.com/shootingallday/propfirm-calc">GitHub</a><a class="end" href="#features">Feature map</a></footer>
<nav class="tabbar" aria-label="Primary" id="tabbar"></nav>
<button class="px-btn fab" data-variant="primary" data-size="lg" data-add><px-icon name="add"></px-icon>Add account</button>

<dialog class="px-overlay" data-overlay="dialog" closedby="any" id="add-dialog" aria-labelledby="add-title"></dialog>
<dialog class="px-overlay" data-overlay="dialog" role="alertdialog" id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-desc"></dialog>

<script type="module">
import "./px/icons.js";
import { money, pnl, toneOf } from "./px/format.js";
import { mountTabs, mountAccordion } from "./px/navigation.js";
import { mountSlider, mountDrop } from "./px/forms.js";
import { mountMenu } from "./px/menu.js";
import { openOverlay } from "./px/overlay.js";
import { toast } from "./px/toast.js";
import { renderChart } from "./px/chart.js";
import { switchTheme } from "./px/theme-switch.js";

const DATES = ["Sep 28","Sep 25","Sep 24","Sep 23","Sep 22","Sep 21","Sep 18","Sep 17","Sep 16"];
const RAW = [
 {id:"tpt",name:"TPT 50K PRO",firm:"Take Profit Trader",plan:"Test · $50,000",stage:"PRO",kind:"funded",lock:"start",off:0,linked:"TPT50K-1",src:"Tradovate Fills · fees on 8 sides",
  pnl:[640,-215,312.5,455,-120,388,218,-46,210],payoutAt:50001,group:"ready",
  next:"Payout ready via PRO withdrawal",nextAmt:"About $1,474 to you",
  paths:[{name:"PRO withdrawal",split:"80%",status:"Ready",tone:"gain",profit:1842.5,start:"Sep 16",win:null,withdraw:1842.5,you:1474,blockers:[]},
   {name:"PRO+",split:"90%",status:"Opens Oct 16",profit:1842.5,start:"Sep 16",win:null,withdraw:1842.5,you:1658,blockers:["Opens 2026-10-16, 30 calendar days after the first trade"]}],
  rules:{dd:"$2,000 end-of-day trailing, stops at the starting balance",target:"None in PRO",dll:"None",cons:"None in PRO"}},
 {id:"mffu",name:"MFFU Rapid 50K",firm:"MyFundedFutures",plan:"Rapid · $50,000",stage:"Funded",kind:"funded",lock:"start100",off:0,linked:"MFFU50K-2",src:"Tradovate Fills + Cash History",
  pnl:[410.75,-180,236,-95.5,318,226],payoutAt:52100,cons:{pct:50,basis:"profit"},group:"track",
  next:"Payout in 4 trading days",nextAmt:"About $1,066 to you via Standard payout",
  paths:[{name:"Standard payout",split:"90%",status:"In 4 trading days",profit:915.25,start:"Sep 21",win:[3,5,150],withdraw:1184,you:1066,blockers:["3 of 5 winning days of $150+","Balance must reach $52,100 ($1,184.75 to go)"]},
   {name:"Buffer withdrawal",split:"90%",status:"Opens Oct 14",profit:915.25,start:"Sep 21",win:[3,10,100],withdraw:0,you:0,blockers:["Opens 2026-10-14","Closed: open only while the balance is under $52,100"]}],
  rules:{dd:"$2,000 end-of-day trailing, locks at $50,100",target:"None when funded",dll:"None",cons:"50% of total profit"}},
 {id:"ts",name:"Topstep 50K Combine",firm:"Topstep",plan:"Trading Combine · $50,000",stage:"Evaluation",kind:"eval",lock:"start",off:4,linked:"",src:"TopstepX Trades",
  pnl:[1050,-310,420,612,408],target:53000,minDays:2,cons:{pct:55,basis:"target"},group:"track",
  next:"Pass in 2 trading days",nextAmt:"$820 still needed",
  rules:{dd:"$2,000 end-of-day trailing, stops at the starting balance",target:"$3,000 · 2 trading days",dll:"None (the optional one isn't modelled)",cons:"Best day at most 55% of the $3,000 target"}},
 {id:"tfy",name:"Tradeify Growth 50K",firm:"Tradeify",plan:"Growth · $50,000",stage:"Evaluation",kind:"eval",lock:"never",off:0,linked:"",src:"Typed",
  pnl:[380,-1250,210,-140,-85,295],target:53000,minDays:1,dll:{amt:1250},group:"risk",
  next:"Pass in 13 trading days",nextAmt:"$3,590 still needed",
  rules:{dd:"$2,000 end-of-day trailing, never locks",target:"$3,000 · 1 trading day",dll:"$1,250, stops you for the day",cons:"None in the evaluation"}},
 {id:"lucid",name:"Lucid Pro 50K",firm:"Lucid Trading",plan:"LucidPro · $50,000",stage:"Funded",kind:"funded",lock:"start100",off:2,linked:"LT-88214",src:"Tradovate Performance",
  pnl:[-1258,-940,-310,520],payoutAt:52100,blown:{date:"Sep 24",why:"drawdown"},group:"blown",paths:[],
  next:"Blown on Sep 24",nextAmt:"Went under the drawdown floor",
  rules:{dd:"$2,000 end-of-day trailing, locks at $50,100",target:"None when funded",dll:"$1,200, stops you for the day",cons:"40% of profit this cycle"}}
];
const ACC = RAW.map(a => {
 const old = [...a.pnl].reverse(); let bal = 50000, peak = 50000, floor = 48000; const series = [];
 for (const p of old) { bal += p; peak = Math.max(peak, bal); floor = peak - 2000; if (a.lock === "start") floor = Math.min(floor, 50000); if (a.lock === "start100") floor = Math.min(floor, 50100); series.push([bal, floor]); }
 const wins = a.pnl.filter(p => p > 0);
 return {...a, bal, peak, floor, paid:0, profit:bal-50000, best:Math.max(...a.pnl), days:a.pnl.length, last:DATES[a.off], series,
  winDays:wins.length, avgWin:wins.reduce((s,p)=>s+p,0)/wins.length, dates:a.pnl.map((_,i)=>DATES[a.off+i]),
  dllHits:a.dll ? a.pnl.map((p,i)=>p<=-a.dll.amt?DATES[a.off+i]:null).filter(Boolean) : []};
});
const S = { x:0, inc:new Set(ACC.filter(a=>!a.blown).map(a=>a.id)), applied:false, empty:false, lastRow:null };
const byId = id => ACC.find(a => a.id === id);
const $ = (sel, root=document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const signed = (v, cls="") => `<span class="px-num px-signed ${cls}" data-tone="${toneOf(v)}">${pnl(v)}</span>`;
const num = v => `<span class="px-num">${money(v)}</span>`;
const cushion = (a, bal=a.bal) => Math.max(0, bal - a.floor);
const bestPct = a => Math.round(a.best / (a.cons.basis === "target" ? 3000 : a.profit) * 100);

function wi(a, x) {
 if (a.blown || !S.inc.has(a.id) || !x) return { bal:a.bal, fx:[], d:0 };
 let d = x; const fx = [];
 if (a.dll && d < -a.dll.amt) { d = -a.dll.amt; fx.push(["Hits the daily loss lock","warn"]); }
 const bal = a.bal + d, profit = a.profit + d, best = Math.max(a.best, d);
 const blows = bal <= a.floor;
 if (blows) fx.push(["Blows the account","loss"]);
 if (a.cons && profit > 0) { const base = v => a.cons.basis === "target" ? 3000 : v; const ok0 = a.best <= a.cons.pct/100*base(a.profit), ok1 = best <= a.cons.pct/100*base(profit); if (ok0 && !ok1) fx.push(["Breaks consistency","loss"]); if (!ok0 && ok1) fx.push(["Fixes consistency","gain"]); }
 if (!blows) { if (a.kind === "eval" && a.bal < a.target && bal >= a.target) fx.push(["Passes the evaluation","gain"]); if (a.kind === "funded" && a.bal < a.payoutAt && bal >= a.payoutAt) fx.push(["Unlocks a payout","gain"]); }
 if (a.kind === "funded" && a.bal >= a.payoutAt && bal < a.payoutAt) fx.push(["Loses a payout","loss"]);
 return { bal, fx, d, capped: d !== x };
}
const fxTags = fx => fx.length ? `<div class="fx">${fx.map(([t,tone]) => `<span class="px-tag" data-tone="${tone}">${t}</span>`).join("")}</div>` : "";
const guardState = a => a.blown ? "breached" : cushion(a) < 1250 ? "near" : "armed";
const meterTone = a => a.blown ? "loss" : cushion(a) < 1250 ? "warn" : "";

const TABS = [["accounts","Accounts","account"],["calendar","Calendar","calendar"],["import","Import","import"],["tools","Tools","settings"]];
function paintNav(tab) {
 $("#nav").innerHTML = TABS.map(([h,l,i]) => `<a href="#${h}"${tab===h?' aria-current="page"':''}><px-icon name="${i}"></px-icon>${l}</a>`).join("");
 $("#tabbar").innerHTML = TABS.map(([h,l,i]) => `<a href="#${h}"${tab===h?' aria-current="page"':''}><px-icon name="${i}"></px-icon>${l}</a>`).join("");
}

function accountsPage(openId) {
 if (S.empty) return `<div class="px-card"><div class="px-state"><span class="px-state-icon"><px-icon name="account"></px-icon></span>
  <h3>No accounts yet</h3><p>Add each prop firm account you trade, then type your daily P&amp;L or import a CSV. Everything stays in this browser.</p>
  <div class="px-state-actions"><button class="px-btn" data-variant="primary" data-add>Add an account</button><button class="px-btn" data-variant="secondary" id="load-demo">Load demo accounts</button></div></div></div>`;
 const net = ACC.reduce((s,a)=>s+a.profit,0);
 return `<div class="page-head"><div><h1>Accounts</h1><p><span class="px-num">${ACC.length}</span> accounts · ${signed(net)} net · 1 payout ready · 1 blown</p></div>
  <div class="row"><button class="px-btn px-anchor" data-variant="secondary" popovertarget="acct-more" id="acct-more-btn" aria-label="More account actions"><px-icon name="more"></px-icon></button>
  <div class="px-menu px-overlay" data-overlay="popover" popover="auto" id="acct-more" role="menu">
   <a class="px-menu-item" role="menuitem" href="#import"><px-icon name="import"></px-icon>Import a CSV</a>
   <div class="px-menu-sep"></div>
   <button class="px-menu-item" role="menuitem" type="button" data-toast="Saved propfirm-calc-accounts.json"><px-icon name="export"></px-icon>Export a backup</button>
   <button class="px-menu-item" role="menuitem" type="button" data-toast="Loaded propfirm-calc-accounts.json"><px-icon name="import"></px-icon>Load a backup</button>
  </div></div></div>
 <div class="desk ${openId?"open":""}">
  <div class="stack">
   <section class="px-card whatif" aria-label="What if">
    <div><div class="px-label" style="margin:0">What if tomorrow is</div><div class="x px-num" id="xv" aria-live="off">${pnl(S.x,{fraction:0})}</div></div>
    <div class="px-slider" id="slider"><div class="px-slider-track"><i class="px-slider-fill"></i></div><input type="range" min="-3000" max="3000" step="50" value="${S.x}" aria-label="Tomorrow's P&amp;L on every included account"></div>
    <button class="px-btn px-anchor" data-variant="ghost" data-size="sm" popovertarget="inc-pop" id="inc-btn">${S.inc.size} of ${ACC.length} accounts<px-icon name="chevron-down"></px-icon></button>
    <button class="px-btn" data-variant="secondary" data-size="sm" id="reset" ${S.x?"":"hidden"}>Reset</button>
    <div class="px-popover px-overlay" data-overlay="popover" popover="auto" id="inc-pop" aria-label="Accounts in the what-if">
     <div class="px-popover-title">Include in the what-if</div>
     <div class="px-choices">${ACC.map(a=>`<label class="px-choice"><input class="px-check" type="checkbox" data-inc="${a.id}" ${S.inc.has(a.id)?"checked":""} ${a.blown?"disabled":""}>${esc(a.name)}${a.blown?"<small>Blown, so nothing changes</small>":""}</label>`).join("")}</div></div>
    <p class="px-hint" id="capnote" style="grid-column:1/-1;margin:0" ${ACC.some(a=>wi(a,S.x).capped)?"":"hidden"}>Capped at the daily loss limit on accounts whose firm stops you for the day.</p>
   </section>
   <div class="px-card acct-table" id="live"></div>
  </div>
  ${openId ? `<aside class="px-card panel" id="panel" aria-labelledby="panel-title">${detail(byId(openId))}</aside>` : ""}
 </div>`;
}

function tableHtml(openId) {
 return `<table class="px-table"><thead><tr><th>Account</th><th>Room above the floor</th><th class="r col-balance">Balance</th><th class="r col-profit">Profit</th><th class="col-best">Next</th></tr></thead><tbody>
 ${ACC.map(a => { const w = wi(a, S.x), out = !S.inc.has(a.id) && !a.blown, cu = cushion(a, w.bal);
  return `<tr tabindex="0" data-id="${a.id}" aria-selected="${openId===a.id}" class="${out?"left-out":""}">
  <td><div class="acct-name">${esc(a.name)}</div><div class="row" style="margin-block-start:4px"><span class="px-tag"${a.blown?' data-tone="loss"':''}>${a.blown?"Blown":a.stage}</span>${out?'<span class="acct-sub">· left out of the what-if</span>':""}</div></td>
  <td><div class="room"><span class="px-num">${a.blown ? "Under by "+money(a.floor-a.bal,{fraction:0}) : money(cu,{fraction:0})}</span><div class="px-meter" ${meterTone(a)?`data-tone="${meterTone(a)}"`:""}><i style="width:${a.blown?100:Math.max(2,Math.min(100,cu/2000*100))}%;animation:none"></i></div></div></td>
  <td class="r col-balance">${num(w.bal)}${w.d?`<div class="acct-sub">${signed(w.d)}</div>`:""}</td>
  <td class="r col-profit">${signed(a.profit)}</td>
  <td class="col-best"><div>${esc(a.next)}</div><div class="acct-sub">${esc(a.nextAmt)}</div>${S.x && !a.blown && S.inc.has(a.id) ? fxTags(w.fx) : ""}</td></tr>`; }).join("")}
 </tbody></table>`;
}

function detail(a) {
 const w = wi(a, S.x);
 const alert = a.blown
  ? `<div class="px-alert" data-tone="loss" role="status"><px-icon name="error"></px-icon><div><b>Blown on ${a.blown.date}</b><p>The balance closed at ${money(a.bal)}, under the ${money(a.floor)} floor.</p></div></div>`
  : a.kind === "eval" && a.bal >= a.target ? `<div class="px-alert" data-tone="gain" role="status"><px-icon name="success"></px-icon><div><b>Passed</b><p>Add the Funded account with its rules filled in.</p></div><button class="px-btn" data-variant="secondary" data-size="sm" data-add>Add Funded account</button></div>` : "";
 const used = Math.max(0, Math.min(2000, 2000 - cushion(a)));
 const guard = `<div class="px-guard" data-state="${guardState(a)}" role="status"><div class="px-guard-head"><px-icon name="guarded"></px-icon>Drawdown floor ${money(a.floor)}<span class="px-guard-used px-num">${money(used,{fraction:0})} of $2,000 used</span></div>
  <div class="px-meter" ${meterTone(a)?`data-tone="${meterTone(a)}"`:""}><i style="width:${a.blown?100:used/2000*100}%"></i></div>
  <small>${a.blown ? "Breached" : money(cushion(a),{fraction:0}) + " of room left" + (a.lock==="never" ? ", and it never locks" : "")}</small></div>`;
 const stats = `<div class="stats"><div class="px-card px-stat"><div class="px-stat-label">Balance</div><div class="px-stat-value px-num">${money(a.bal)}</div></div>
  <div class="px-card px-stat"><div class="px-stat-label">Profit</div><div class="px-stat-value">${signed(a.profit)}</div></div>
  <div class="px-card px-stat"><div class="px-stat-label">Best day</div><div class="px-stat-value px-num">${money(a.best)}</div>${a.cons?`<div class="px-stat-sub">${bestPct(a)}% of ${a.cons.basis==="target"?"target":"profit"} · limit ${a.cons.pct}%</div>`:""}</div></div>`;

 <section class="px-card stack" style="padding:var(--px-space-4) var(--cell-px)" aria-labelledby="dt-h"><h2 id="dt-h" style="font-size:var(--px-text-md)">Days to target</h2>
  <div class="fields"><label class="px-field"><span class="px-label">Profit so far</span><input class="px-input" id="p-prof" inputmode="decimal" value="2180"></label><label class="px-field"><span class="px-label">Target</span><input class="px-input" id="p-tgt" inputmode="decimal" value="3000"></label>
  <label class="px-field"><span class="px-label">Average day</span><input class="px-input" id="p-avg" inputmode="decimal" value="412"></label><label class="px-field"><span class="px-label">Best day</span><input class="px-input" id="p-best" inputmode="decimal" value="1050"></label>
  <label class="px-field"><span class="px-label">Consistency %</span><input class="px-input" id="p-pct" inputmode="decimal" value="55"></label></div>
  <div class="px-card px-stat"><div class="px-stat-label">Trading days to the target</div><div class="px-stat-value px-num" id="p-out"></div></div></section></div></div>`;
}
function toolsCalc() {
 const q = id => parseFloat($("#"+id)?.value) || 0; if (!$("#t-out")) return;
 const c = Math.floor(q("t-risk") / (q("t-tick") * q("t-stop") || 1)); $("#t-out").textContent = c + (c === 1 ? " contract" : " contracts");
 const tgt = Math.max(q("p-tgt"), q("p-best") / (q("p-pct") / 100 || 1)), d = q("p-avg") > 0 ? Math.max(0, Math.ceil((tgt - q("p-prof")) / q("p-avg"))) : "—";
 $("#p-out").textContent = d + " days" + (tgt > q("p-tgt") ? ` · target raised to ${money(tgt)}` : "");
}

const FEAT = [
 ["Whole app",[["Logo, name, four tabs","Top bar; bottom tab bar on a phone"],["Load demo accounts, only with no accounts","Empty state on Accounts"],["Footer: rules checked date, data stays in the browser, GitHub","Footer"],["Installs as an app, works offline","Not placed: the browser offers the install"],["Saved in the browser automatically","Not placed: a behaviour. The footer and empty state say it"]]],
 ["Dashboard",[["Empty state with Add an account","Accounts, no accounts"],["Summary: accounts, net profit, payouts ready, blown","One line under the Accounts title"],["What-if slider, −$3,000 to +$3,000 in $50 steps, reset, cap note","What-if bar above the table. Reset shows once moved; the cap note only when capped"],["What-if checkbox per account","\"4 of 5 accounts\" popover in the what-if bar"],["Name, plan, stage badge","Account column"],["Number line: floor, start, balance, target or peak","Room above the floor meter in the table; the drawdown guard and chart in the panel"],["Balance, cushion, profit, best day with %","Table columns; the panel's stats"],["Consistency line","Best day stat and Evaluation section"],["Next step","Next column; top of the panel"],["Notes in small text","More numbers, in the panel"],["If tomorrow is $X changes","Tags in the Next column and the panel"],["Blown look, left out of the what-if","Blown tag and red meter; muted row with \"left out\""]]],
 ["Accounts",[["Add account","Top bar button (floating button on a phone), then a dialog"],["Export all, import a backup","Accounts ⋯ menu"],["Add form: firm, plan, stage, name, fee, rules summary","Add account dialog"],["Rules summary with payout paths, notes, checked date","Rules tab; the dialog shows the key rules"],["Edit the name in place","Panel ⋯ menu, Rename"],["Plan, stage badge, linked broker ids","Line under the panel title"],["Delete, asks first","Panel ⋯ menu, then a confirm dialog"],["Passed: add the Funded account","Alert at the top of the panel"],["Override this account's rules","Rules tab, folded"],["Daily P&L entry, table with source, remove","Days tab"],["Payouts entry, list, empty text","Payouts tab"]]],
 ["Import",[["Intro, drop zone, several files, supported kinds, Orders advice","Import"],["Per file: name, kind, table, Goes into, warnings","File card; warnings folded"],["Errors per file","Alert per file"],["Apply import, log per account","Import button, then an alert with the log"]]],
 ["Calendar",[["Assumption line","Under the title"],["Averages with the under-5 warning and your own average","Averages used, folded"],["Weeks with totals and events","Weeks card"],["Not on the calendar, with why","Folded section"],["Both empty states","#calendar-empty"]]],
 ["Worked out by the engine, not shown before",[["Every payout path ranked, with blockers","Best path in Overview, the rest folded"],["Per path: profit this cycle, cycle start, winning days, withdraw before and after the split, when it opens","Same"],["Evaluation: profit needed, days so far vs needed, blockers","Evaluation section in Overview"],["Peak balance, total paid out, trading days, last day","More numbers"],["Days that hit the daily loss limit","Tag in the Days tab; More numbers"],["Average winning day and the one estimates use","More numbers"],["The day the account blew, and why","Alert at the top of the panel"],["Floor day by day (needs an engine change)","Balance and floor chart"]]],
 ["Package CLI",[["size and project","Tools"],["drawdown, consistency, payout, firms, import, status","Covered by the panel, Rules, Import and Accounts"]]]];
function featuresPage() {
 return `<div class="narrow"><div class="page-head"><div><h1>Feature map</h1><p>Every line of docs/features.md and where it sits.</p></div></div><div class="stack">
 ${FEAT.map(([g,rows])=>`<div class="px-card" style="overflow-x:auto"><table class="px-table"><thead><tr><th style="width:50%">${g}</th><th>Where</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="muted">${esc(r[1])}</td></tr>`).join("")}</tbody></table></div>`).join("")}
 <div class="px-alert" role="status"><px-icon name="info"></px-icon><div><b>Couldn't place</b><p>Installing as an app and working offline (the browser offers it), and automatic saving with no sign-in (a behaviour, not a control).</p></div></div></div></div>`;
}

const route = () => (location.hash.slice(1) || "accounts").split("/");
function fillTable() {
 const live = $("#live"); if (!live) return;
 const open = route()[1]; live.innerHTML = tableHtml(open);
 $("#capnote")?.toggleAttribute("hidden", !ACC.some(a => wi(a, S.x).capped));
 $("#inc-btn") && ($("#inc-btn").firstChild.textContent = `${S.inc.size} of ${ACC.length} accounts`);
}
function paintSlider(root) {
 const v = +root.querySelector("input").value, mid = 50, at = (v + 3000) / 60;
 root.style.setProperty("--px-from", Math.min(mid, at) + "%"); root.style.setProperty("--px-to", Math.max(mid, at) + "%");
}
function drawChart(a) {
 const el = $("#chart"); if (!el) return;
 const s = a.series, labels = [...a.dates].reverse();
 renderChart(el, { title:"Balance and floor", kind:"line", labels, format:"money", reveal:false, series:[{ name:"Balance", values:s.map(p=>p[0]) }, { name:"Floor", tone:"loss", values:s.map(p=>p[1]) }] });
}
function mount() {
 const [r, id] = route();
 const tab = ["calendar","calendar-empty"].includes(r) ? "calendar" : ["import","tools"].includes(r) ? r : r === "features" ? "" : "accounts";
 paintNav(tab);
 const main = $("#main");
 main.innerHTML = r === "calendar" ? calendarPage(false) : r === "calendar-empty" ? calendarPage(true) : r === "import" ? importPage() : r === "tools" ? toolsPage() : r === "features" ? featuresPage() : accountsPage(r === "account" && byId(id) ? id : null);
 document.title = (tab ? TABS.find(t => t[0] === tab)?.[1] : "Feature map") + " · propfirm-calc";
 fillTable();
 const slider = $("#slider"); if (slider) { mountSlider(slider); paintSlider(slider); slider.querySelector("input").addEventListener("input", e => { S.x = +e.target.value; $("#xv").textContent = pnl(S.x,{fraction:0}); $("#reset").hidden = !S.x; paintSlider(slider); fillTable(); const p = $("#panel"); if (p) { p.innerHTML = detail(byId(route()[1])); wirePanel(); } }); }
 for (const m of document.querySelectorAll("#main .px-menu:not(#panel .px-menu)")) mountMenu(m, { trigger: document.querySelector(`[popovertarget="${m.id}"]`) });
 for (const acc of document.querySelectorAll("#main .px-accordion:not(#panel .px-accordion)")) mountAccordion(acc);
 if ($("#drop")) mountDrop($("#drop"), { upload: async () => {} });
 toolsCalc();
 wirePanel();
}
function wirePanel() {
 const p = $("#panel"); if (!p) return;
 mountTabs($("#detail-tabs"));
 for (const acc of p.querySelectorAll(".px-accordion")) mountAccordion(acc);
 for (const m of p.querySelectorAll(".px-menu")) mountMenu(m, { trigger: p.querySelector(`[popovertarget="${m.id}"]`) });
 drawChart(byId(route()[1]));
}

addEventListener("hashchange", () => {
 const wasPanel = !!$("#panel");
 mount();
 const [r, id] = route();
 if (r === "account") $("#panel-title")?.focus({ preventScroll: true });
 else if (wasPanel && S.lastRow) document.querySelector(`tr[data-id="${S.lastRow}"]`)?.focus();
 else { $("#main").focus({ preventScroll: true }); scrollTo(0, 0); }
});
addEventListener("resize", () => drawChart(byId(route()[1]) || ACC[0]));
document.addEventListener("click", e => {
 const t = e.target;
 if (t.closest("[data-add]")) { const d = $("#add-dialog"); d.innerHTML = addDialog(); openOverlay(d); return; }
 if (t.closest("#close-panel")) { location.hash = "accounts"; return; }
 if (t.closest("#reset")) { S.x = 0; mount(); $("#slider input")?.focus(); return; }
 if (t.closest("#apply")) { S.applied = true; mount(); return; }
 if (t.closest("#load-demo")) { S.empty = false; mount(); return; }
 const toastBtn = t.closest("[data-toast]"); if (toastBtn) { toast.success(toastBtn.dataset.toast); return; }
 if (t.closest("#rename")) { const h = $("#panel-title"); h.contentEditable = "plaintext-only"; setTimeout(() => { h.focus(); getSelection().selectAllChildren(h); getSelection().collapseToEnd(); }, 0); return; }
 if (t.closest("#delete")) { const d = $("#delete-dialog"); d.innerHTML = deleteDialog(byId(route()[1])); openOverlay(d); return; }
 const rm = t.closest("[data-remove]"); if (rm) { const row = rm.closest("tr"); row.hidden = true; toast(`Removed ${rm.dataset.remove}`, { action: { label: "Undo", onClick: () => { row.hidden = false; } } }); return; }
 if (t.closest("input,button,select,a,label")) return;
 const tr = t.closest("tr[data-id]"); if (tr) { S.lastRow = tr.dataset.id; location.hash = "account/" + tr.dataset.id; }
});
document.addEventListener("keydown", e => {
 const tr = e.target.closest?.("tr[data-id]");
 if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); S.lastRow = tr.dataset.id; location.hash = "account/" + tr.dataset.id; return; }
 if (tr && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); (e.key === "ArrowDown" ? tr.nextElementSibling : tr.previousElementSibling)?.focus(); return; }
 if (e.key === "Escape" && route()[0] === "account" && !document.querySelector("dialog[open], :popover-open")) { location.hash = "accounts"; }
 if (e.key === "Enter" && e.target.id === "panel-title" && e.target.isContentEditable) { e.preventDefault(); e.target.contentEditable = "false"; toast.success("Renamed to " + e.target.textContent); }
});
document.addEventListener("input", e => toolsCalc());
document.addEventListener("change", e => {
 if (e.target.dataset.inc) { S.inc.has(e.target.dataset.inc) ? S.inc.delete(e.target.dataset.inc) : S.inc.add(e.target.dataset.inc); fillTable(); }
 if (e.target.id === "firm") { $("#add-rules").innerHTML = addRules(e.target.value); $("#plan").innerHTML = `<option>${FIRMS[e.target.value][0]}</option>`; }
});
$("#add-dialog").addEventListener("close", e => { if (e.target.returnValue === "add") { toast.success("Added Topstep 50K Combine"); S.lastRow = "ts"; location.hash = "account/ts"; } });
$("#delete-dialog").addEventListener("close", e => { const v = e.target.returnValue; if (v && v !== "cancel") { toast("Deleted " + byId(v).name); location.hash = "accounts"; } });
$("#theme").addEventListener("click", e => { const dark = !document.documentElement.classList.contains("dark"); switchTheme(dark, document.documentElement, { from: e.currentTarget }); e.currentTarget.innerHTML = `<px-icon name="${dark?"light":"dark"}"></px-icon>`; e.currentTarget.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode"); });

const q = new URLSearchParams(location.search);
if (q.get("x")) S.x = +q.get("x");
if (q.get("applied")) S.applied = true;
if (q.get("empty")) S.empty = true;
if (q.get("theme") === "dark") { document.documentElement.classList.add("dark"); $("#theme").innerHTML = `<px-icon name="light"></px-icon>`; $("#theme").setAttribute("aria-label","Switch to light mode"); }
mount();
</script>
</body>
</html>
