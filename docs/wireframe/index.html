<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>propfirm-calc wireframe</title>
<style>
:root{--bg:#ececec;--surface:#f9f9f9;--fill:#e2e2e2;--fill2:#d4d4d4;--line:#d6d6d6;--ink:#1d1d1d;--muted:#6e6e6e;--faint:#a3a3a3;--dark:#4a4a4a;--r:12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;font-size:14px;line-height:1.4;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12px}.faint{color:var(--faint)}
h1{font-size:22px;margin:0;font-weight:600}h2{font-size:16px;margin:0;font-weight:600}h3{font-size:14px;margin:0;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn:active{transform:scale(.97)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field input,.field select,.in{height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;color:var(--ink);font-size:14px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--fill);font-size:12px;color:var(--ink);white-space:nowrap}
.pill.outline{background:none;border:1px solid var(--fill2)}
.pill.dark{background:var(--dark);color:#fff}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.skel{height:9px;border-radius:5px;background:var(--fill2);margin:6px 0}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:18px;height:60px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.logo{width:26px;height:26px;border-radius:7px;background:var(--dark)}
.nav{display:flex;gap:2px}
.nav a{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;text-decoration:none;color:var(--muted)}
.nav a.on{background:var(--fill);color:var(--ink);font-weight:500}
.main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:24px}
.foot{display:flex;gap:16px;flex-wrap:wrap;padding:18px 24px 90px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.foot a{margin-left:auto}
.whatif{display:flex;align-items:center;gap:16px;padding:12px 16px}
.whatif input[type=range]{flex:1;accent-color:var(--dark)}
.whatif .val{font-size:20px;font-weight:600;min-width:92px}
.runway{position:relative;height:10px;border-radius:5px;background:var(--fill)}
.runway .fillr{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--fill2)}
.runway .mk{position:absolute;top:-4px;width:2px;height:18px;background:var(--dark)}
.runway .mk.soft{background:var(--faint)}
.runway .dot{position:absolute;top:-4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.runway .ghost{position:absolute;top:-4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:2px dashed var(--ink);background:none}
.runway.blown .dot{background:var(--ink)}
table{border-collapse:collapse;width:100%}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#f1f1f1}
tr.sel td{background:#e8e8e8}
td.r,th.r{text-align:right}
.fx{display:flex;gap:4px;flex-wrap:wrap}
.fade{opacity:.45}
.drawer{position:fixed;top:60px;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);overflow:auto;z-index:4;box-shadow:-12px 0 32px rgba(0,0,0,.08);animation:slide .22s cubic-bezier(.23,1,.32,1)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.lane{display:grid;grid-template-columns:220px 1fr 260px;gap:20px;align-items:center;padding:16px;cursor:pointer}
.lane:hover{background:#f3f3f3}
.lane+.lane{border-top:1px solid var(--line)}
.scale{display:grid;grid-template-columns:220px 1fr 260px;gap:20px;padding:0 16px 6px;font-size:11px;color:var(--muted)}
.ticks{display:flex;justify-content:space-between}
.group h2{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.item{display:grid;grid-template-columns:1fr 160px 30px;gap:16px;align-items:center;padding:14px 16px;cursor:pointer}
.item+.item{border-top:1px solid var(--line)}
.item:hover{background:#f3f3f3}
.big{font-size:22px;font-weight:600}
.split{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.mini{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border:1px solid transparent}
.mini.on{background:var(--surface);border-color:var(--line)}
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.figs>div{background:var(--surface);padding:10px 12px}
.figs b{display:block;font-size:16px;font-weight:600;margin-top:2px}
.new{position:relative}
.new::after{content:"NEW";position:absolute;top:10px;right:12px;font-size:10px;letter-spacing:.04em;border:1px dashed var(--muted);border-radius:4px;padding:1px 5px;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}.prog i{display:block;height:100%;background:var(--dark)}
.drop{border:2px dashed var(--fill2);border-radius:var(--r);padding:36px;text-align:center;background:var(--surface)}
.week{display:grid;grid-template-columns:140px 1fr 110px;gap:16px;padding:14px 16px;align-items:start}
.week+.week{border-top:1px solid var(--line)}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r);background:var(--fill)}
.tabbar{display:none}
@media (max-width:760px){
 .top{padding:0 16px}.nav{display:none}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--surface);border-top:1px solid var(--line);z-index:6;justify-content:space-around;align-items:center}
 .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;text-decoration:none;color:var(--muted)}
 .tabbar a.on{color:var(--ink);font-weight:600}
 .main{padding:16px}
 .hide-s{display:none!important}
 .lane,.scale{grid-template-columns:1fr}.scale>div:first-child,.scale>div:last-child{display:none}
 .split{grid-template-columns:1fr}.split>.list{display:none}
 .figs{grid-template-columns:repeat(2,1fr)}
 .grid2{grid-template-columns:1fr}
 .item{grid-template-columns:1fr 110px}.item>:last-child{display:none}
 .week{grid-template-columns:1fr}
 .whatif{flex-wrap:wrap}.whatif input[type=range]{flex-basis:100%;order:3}
 .drawer{top:0;z-index:7}
 .desk tr:first-child{display:none}
 .desk tr{display:grid;grid-template-columns:24px 1fr auto;gap:6px 10px;padding:12px;border-bottom:1px solid var(--line)}
 .desk tr:last-child{border-bottom:0}
 .desk td{padding:0;border:0}
 .desk td.cu,.desk td.fxc{grid-column:2/-1;text-align:left}
 .desk td.cu::before{content:"Cushion ";color:var(--muted);font-size:12px}
}
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker[data-position="top"]{bottom:auto;top:24px}
@media (max-width:760px){.proto-picker{bottom:76px}}
</style>
</head>
<body>
<div id="stage"></div>
<nav class="proto-picker" aria-label="Prototype variants">
 <span class="proto-picker-highlight" aria-hidden="true"></span>
 <button class="proto-picker-item" data-active aria-current="true">Desk</button>
 <button class="proto-picker-item">Runway</button>
 <button class="proto-picker-item">Checklist</button>
</nav>
<script>
const I={
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 tool:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 back:'<path d="M15 18l-6-6 6-6"/>',
 chev:'<path d="M9 18l6-6-6-6"/>',
 more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
 cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
 edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const money=(n,s)=>{const v=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:Math.round(n*100)%100?2:0,maximumFractionDigits:2});return (n<0?'−':s&&n>0?'+':'')+'$'+v};
const DATES=['Sep 28','Sep 25','Sep 24','Sep 23','Sep 22','Sep 21','Sep 18','Sep 17','Sep 16'];
const RAW=[
 {id:'tpt',name:'TPT 50K PRO',firm:'Take Profit Trader',plan:'Test · $50,000',stage:'PRO',kind:'funded',lock:'start',off:0,linked:'TPT50K-1',src:'Tradovate Fills · fees on 8 sides',
  pnl:[640,-215,312.5,455,-120,388,218,-46,210],payoutAt:50001,
  next:'Payout ready via PRO withdrawal',nextAmt:'about $1,474 to you',group:'ready',
  paths:[{name:'PRO withdrawal',split:'80%',status:'Ready',profit:1842.5,start:'Sep 16',win:null,withdraw:1842.5,you:1474,blockers:[]},
   {name:'PRO+ (90% split)',split:'90%',status:'Opens Oct 16',profit:1842.5,start:'Sep 16',win:null,withdraw:1842.5,you:1658,blockers:['Opens 2026-10-16, 30 calendar days after the first trade']}],
  rules:{dd:'$2,000 end-of-day trailing, stops at the starting balance',target:'None in PRO',dll:'None',cons:'None in PRO',notes:2}},
 {id:'mffu',name:'MFFU Rapid 50K',firm:'MyFundedFutures',plan:'Rapid · $50,000',stage:'Funded',kind:'funded',lock:'start100',off:0,linked:'MFFU50K-2',src:'Tradovate Fills + Cash History',
  pnl:[410.75,-180,236,-95.5,318,226],payoutAt:52100,cons:{pct:50,basis:'profit'},
  next:'Payout in 4 trading days via Standard payout',nextAmt:'about $1,066 to you',group:'track',
  paths:[{name:'Standard payout',split:'90%',status:'In 4 trading days',profit:915.25,start:'Sep 21',win:[3,5,150],withdraw:1184,you:1066,blockers:['3 of 5 winning days of $150+','Balance must reach $52,100 ($1,184.75 to go)']},
   {name:'Buffer withdrawal',split:'90%',status:'Opens Oct 14',profit:915.25,start:'Sep 21',win:[3,10,100],withdraw:0,you:0,blockers:['Opens 2026-10-14','Closed: open only while the balance is under $52,100']}],
  rules:{dd:'$2,000 end-of-day trailing, locks at $50,100',target:'None when funded',dll:'None',cons:'50% of total profit',notes:3}},
 {id:'ts',name:'Topstep 50K Combine',firm:'Topstep',plan:'Trading Combine · $50,000',stage:'Evaluation',kind:'eval',lock:'start',off:4,linked:'',src:'TopstepX Trades',
  pnl:[1050,-310,420,612,408],target:53000,minDays:2,cons:{pct:55,basis:'target'},
  next:'Pass in 2 trading days',nextAmt:'$820 still needed',group:'track',
  rules:{dd:'$2,000 end-of-day trailing, stops at the starting balance',target:'$3,000 · 2 trading days',dll:'None (optional one not modelled)',cons:'Best day ≤ 55% of the $3,000 target',notes:3}},
 {id:'tfy',name:'Tradeify Growth 50K',firm:'Tradeify',plan:'Growth · $50,000',stage:'Evaluation',kind:'eval',lock:'never',off:0,linked:'',src:'Typed',
  pnl:[380,-1250,210,-140,-85,295],target:53000,minDays:1,dll:{amt:1250},
  next:'Pass in 13 trading days',nextAmt:'$3,590 still needed',group:'risk',
  rules:{dd:'$2,000 end-of-day trailing, never locks',target:'$3,000 · 1 trading day',dll:'$1,250, stops you for the day',cons:'None in the evaluation',notes:2}},
 {id:'lucid',name:'Lucid Pro 50K',firm:'Lucid Trading',plan:'LucidPro · $50,000',stage:'Funded',kind:'funded',lock:'start100',off:2,linked:'LT-88214',src:'Tradovate Performance',
  pnl:[-1258,-940,-310,520],payoutAt:52100,blown:{date:'Sep 24',why:'drawdown'},
  next:'Blown on Sep 24 (drawdown)',nextAmt:'',group:'blown',paths:[],
  rules:{dd:'$2,000 end-of-day trailing, locks at $50,100',target:'None when funded',dll:'$1,200, stops you for the day',cons:'40% of profit this cycle',notes:2}}
];
const ACC=RAW.map(a=>{const old=[...a.pnl].reverse();let bal=50000,peak=50000,floor=48000;const series=[];
 for(const p of old){bal+=p;peak=Math.max(peak,bal);floor=peak-2000;if(a.lock==='start')floor=Math.min(floor,50000);if(a.lock==='start100')floor=Math.min(floor,50100);series.push([bal,floor]);}
 const wins=a.pnl.filter(p=>p>0);
 return {...a,bal,peak,floor,paid:0,profit:bal-50000,best:Math.max(...a.pnl),days:a.pnl.length,last:DATES[a.off],series,
  winDays:wins.length,avgWin:wins.reduce((s,p)=>s+p,0)/wins.length,dates:a.pnl.map((_,i)=>DATES[a.off+i]),
  dllHits:a.dll?a.pnl.map((p,i)=>p<=-a.dll.amt?DATES[a.off+i]:null).filter(Boolean):[]}});
const S={x:0,inc:new Set(ACC.map(a=>a.id).filter(id=>id!=='lucid')),applied:false};
const byId=id=>ACC.find(a=>a.id===id);
function wi(a,x){
 if(a.blown||!S.inc.has(a.id)||!x)return{bal:a.bal,fx:[],d:0};
 let d=x;const fx=[];
 if(a.dll&&d<-a.dll.amt){d=-a.dll.amt;fx.push('Hits the daily loss lock')}
 const bal=a.bal+d,profit=a.profit+d,best=Math.max(a.best,d);
 if(bal<=a.floor)fx.push('Blows the account');
 if(a.cons&&profit>0){const base=v=>a.cons.basis==='target'?3000:v;const ok0=a.best<=a.cons.pct/100*base(a.profit),ok1=best<=a.cons.pct/100*base(profit);if(ok0&&!ok1)fx.push('Breaks consistency');if(!ok0&&ok1)fx.push('Fixes consistency')}
 if(!fx.includes('Blows the account')){
  if(a.kind==='eval'&&a.bal<a.target&&bal>=a.target)fx.push('Passes the evaluation');
  if(a.kind==='funded'&&a.bal<a.payoutAt&&bal>=a.payoutAt)fx.push('Unlocks a payout');}
 if(a.kind==='funded'&&a.bal>=a.payoutAt&&bal<a.payoutAt)fx.push('Loses a payout');
 return{bal,fx,d,capped:d!==x};
}
const cushion=(a,bal=a.bal)=>Math.max(0,bal-a.floor);
function runway(a,bal,wide){
 const end=a.kind==='eval'?a.target:Math.max(a.payoutAt,a.peak),lo=a.floor-300,hi=end+300,p=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
 const g=bal!==a.bal?`<span class="ghost" style="left:${p(bal)}%"></span>`:'';
 return `<div class="runway ${a.blown?'blown':''}"><span class="fillr" style="width:${p(a.bal)}%"></span><span class="mk" style="left:${p(a.floor)}%" title="Floor"></span><span class="mk soft" style="left:${p(50000)}%" title="Start"></span><span class="mk" style="left:${p(end)}%"></span><span class="dot" style="left:${p(a.bal)}%"></span>${g}</div>`+
  (wide?`<div class="row between small muted num" style="margin-top:4px"><span>Floor ${money(a.floor)}</span><span>Start $50,000</span><span>${a.kind==='eval'?'Target '+money(a.target):'Payout at '+money(a.payoutAt)}</span></div>`:'');
}
const bestPct=a=>Math.round(a.best/(a.cons.basis==='target'?3000:a.profit)*100);
const consLine=a=>a.cons?`Consistency ${a.cons.pct}%: best day is ${bestPct(a)}% of ${a.cons.basis==='target'?'the target':'profit'}, within the limit`:'No consistency rule on this stage';
const fxPills=f=>f.length?`<div class="fx">${f.map(t=>`<span class="pill ${/Blows|Breaks|Loses|lock/.test(t)?'dark':'outline'}">${t}</span>`).join('')}</div>`:'<span class="faint small">No change</span>';
const summary=()=>{const net=ACC.reduce((s,a)=>s+a.profit,0);return `<span><b>${ACC.length}</b> accounts</span><span><b class="num">${money(net,1)}</b> net</span><span><b>${ACC.filter(a=>a.group==='ready').length}</b> payout ready</span><span><b>${ACC.filter(a=>a.blown).length}</b> blown</span>`};
const capText=()=>ACC.some(a=>wi(a,S.x).capped)?'Capped at the daily loss limit where the firm stops you for the day':'';
function whatifBar(){return `<div class="card whatif"><div><div class="small muted">What if tomorrow is</div><div class="val num" id="xv">${money(S.x,1)}</div></div>
 <input type="range" min="-3000" max="3000" step="50" value="${S.x}" id="slider" aria-label="Tomorrow's P&amp;L on every included account">
 <div class="small muted" style="width:180px"><span id="incn">on ${S.inc.size} of ${ACC.length} accounts</span><br><span id="capnote">${capText()}</span></div>
 <button class="btn sm" id="reset">Reset</button></div>`}
function shell(inner,tab,opts={}){
 const t=[['accounts','Accounts','list'],['calendar','Calendar','cal'],['import','Import','up'],['tools','Tools','tool']];
 return `<div class="app"><header class="top"><div class="brand"><span class="logo"></span>propfirm-calc</div>
 <nav class="nav">${t.map(([h,l,i])=>`<a href="#${h}" class="${tab===h?'on':''}">${ic(i)}${l}</a>`).join('')}</nav>
 <div style="margin-left:auto" class="row">${opts.empty?'<a class="btn sm" href="#accounts">Load demo accounts</a>':'<a class="btn sm primary" href="#add">'+ic('plus')+'Add account</a>'}</div></header>
 <main class="main">${inner}</main>
 <footer class="foot"><span>Firm rules checked up to Sep 29, 2026</span><span>Your data stays in this browser</span><span>GitHub</span><a href="#features">Wireframe feature map →</a></footer>
 <nav class="tabbar">${t.map(([h,l,i])=>`<a href="#${h}" class="${tab===h?'on':''}">${ic(i)}${l}</a>`).join('')}</nav></div>`}

function detail(a,mode){

function calendarEmpty(){return `<div class="stack" style="max-width:1080px;margin:0 auto"><h1>Payout calendar</h1><div class="card" style="text-align:center;padding:56px"><h2>Nothing lands in the next 60 trading days</h2><p class="muted" style="margin:8px 0 0">at these averages. Raise an average day above, or add days so one can be measured.</p></div><div class="card" style="text-align:center;padding:40px"><h2>Add accounts to see when they can pay out.</h2><p class="small muted" style="margin:8px 0 0">Shown when there are no accounts.</p></div></div>`}

function tools(){return `<div class="stack" style="max-width:980px;margin:0 auto"><div><h1>Tools</h1><p class="muted" style="margin:6px 0 0">The same engine as the <code>size</code> and <code>project</code> CLI commands.</p></div>
 <div class="grid2"><div class="card pad stack new"><h3>Position size</h3><label class="field">Account<select id="t-acct">${ACC.filter(a=>!a.blown).map(a=>`<option>${a.name} · ${money(cushion(a))} cushion</option>`).join('')}</select></label>
  <div class="grid2"><label class="field">Tick value<input id="t-tick" value="5"></label><label class="field">Stop (ticks)<input id="t-stop" value="20"></label></div><label class="field">Risk per trade<input id="t-risk" value="500"></label>
  <div class="card pad" style="background:var(--fill)"><div class="small muted">Contracts</div><div class="big num" id="t-out"></div></div></div>
 <div class="card pad stack new"><h3>Days to target</h3><div class="grid2"><label class="field">Profit so far<input id="p-prof" value="2180"></label><label class="field">Target<input id="p-tgt" value="3000"></label><label class="field">Average day<input id="p-avg" value="412"></label><label class="field">Best day<input id="p-best" value="1050"></label><label class="field">Consistency %<input id="p-pct" value="55"></label></div>
  <div class="card pad" style="background:var(--fill)"><div class="small muted">Trading days to the target</div><div class="big num" id="p-out"></div></div></div></div></div>`}
function toolsCalc(){const q=id=>parseFloat(document.getElementById(id)?.value)||0;if(!document.getElementById('t-out'))return;
 const c=Math.floor(q('t-risk')/(q('t-tick')*q('t-stop')||1));document.getElementById('t-out').textContent=c+(c===1?' contract':' contracts');
 const tgt=Math.max(q('p-tgt'),q('p-best')/(q('p-pct')/100||1)),need=tgt-q('p-prof'),d=q('p-avg')>0?Math.max(0,Math.ceil(need/q('p-avg'))):'—';document.getElementById('p-out').textContent=d+' days'+(tgt>q('p-tgt')?' (target raised to '+money(tgt)+')':'');}

const FEAT=[
['Whole app',[['Header: logo, name, tabs','Top bar on desktop, bottom tab bar on a phone'],['"Load demo accounts", only with no accounts','Top bar in the empty state (#empty)'],['Footer: rules checked date, data stays in the browser, GitHub','Footer'],['Installs as an app, works offline','Not placed: the browser offers the install'],['Saved in the browser automatically','Not placed: a behaviour. The footer and empty state say it']]],
['Dashboard',[['Empty state with "Add an account"','#empty'],['Summary: accounts, net profit, payouts ready, blown','Line beside the Accounts title. Checklist swaps the counts for groups'],['What-if slider, −$3,000 to +$3,000 in $50 steps, reset, cap note','What-if bar under the title'],['Card: name, plan, stage badge, what-if checkbox','Table row (Desk), lane (Runway), item (Checklist)'],['Number line: floor, start, balance, target or peak','Runway bar in each row; lanes on one shared scale; full size on the account'],['Balance, cushion, profit, best day with %','Row columns; figures on the account'],['Consistency line','Account, under the figures'],['Next step: blown, payout ready, payout in N days, pass in N, passed','Next column, lane, item; top of the account'],['Notes in small text','Account, under the cards'],['"If tomorrow is $X" changes','Pills on each row and on the account'],['Blown look, faded when left out','Filled dot, Blown group; faded rows']]],
['Accounts',[['List with "+ Add account"','The Accounts home is the list; Add account sits in the top bar'],['Export all and Import file (backup)','Import, Backup card'],['Add form: firm, plan, stage, name, fee, rules summary','#add'],['Rules summary with payout paths, notes, checked date, reminder','#add and the Rules card on each account'],['Name edited in place, plan, stage badge, linked broker ids','Account header'],['Delete, asks first','Account, last card (and the ⋯ menu)'],['Passed: add the Funded account','Banner on the account'],['Override this account\'s rules','Rules card, folded'],['Daily P&L entry, table with source, remove, empty text','Daily P&L card'],['Payouts entry, list, remove, empty text','Payouts card']]],
['Import',[['Intro, drop zone, several files, supported kinds, Orders advice','Import'],['Per file: name, kind badge, table, "Goes into", warnings','File card'],['Errors per file','Second file card'],['Apply import and the log per account','Apply button; log after applying']]],
['Calendar',[['Assumption line','Calendar header'],['Averages, under-5 warning, your own average','Table at the top'],['Weeks with totals and events, next 60 trading days','Weeks list'],['Not on the calendar, with why','Bottom card'],['Both empty states','#calendar-empty']]],
['Worked out by the engine, not shown today (marked NEW)',[['Every payout path ranked, with blockers','Payout paths card (funded account)'],['Per path: profit this cycle, cycle start, winning days, withdraw before and after the split, days until eligible','Same card'],['Evaluation: profit needed, raised target, days so far vs needed, blockers','Evaluation progress card (eval account)'],['Peak balance, total paid out, trading days, last day','Account figures'],['Days that hit the daily loss limit','Badge in Daily P&L; line on the Checklist item'],['Average winning day and the one estimates use','Account, under the figures'],['The day the account blew, and why','Blown banner'],['Floor day by day (engine change needed)','Balance vs floor chart']]],
['Package CLI',[['size and project','Tools tab (new)'],['drawdown, consistency, payout, firms, import, status','Covered by the account, its rules, Import and Accounts']]]];
function features(){return `<div class="stack" style="max-width:1080px;margin:0 auto"><h1>Feature map</h1><p class="muted" style="margin:0">Every line of docs/features.md and where it sits. The same in all three variants unless noted.</p>
 ${FEAT.map(([g,rows])=>`<div class="card"><table><tr><th style="width:55%">${g}</th><th>Where</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td class="muted">${r[1]}</td></tr>`).join('')}</table></div>`).join('')}
 <div class="card pad"><h3>Couldn't place</h3><p class="small" style="margin:6px 0 0">Installing as an app and working offline: the browser offers the install, so there's nothing to lay out.<br>Saving automatically with no sign-in or server: a behaviour, not a control.</p></div></div>`}

const route=()=>(location.hash.slice(1)||'accounts').split('/');
const V=[{home:deskHome,live:deskLive,mode:'panel'},{home:runwayHome,live:runwayLive,mode:'page'},{home:checkHome,live:checkLive,mode:'split'}];
function page(i){const v=V[i],[r,id]=route();
 if(r==='empty')return shell(emptyHome(),'accounts',{empty:1});
 if(r==='add')return shell(addForm(),'accounts');
 if(r==='import')return shell(importScreen(),'import');
 if(r==='calendar')return shell(calendar(),'calendar');
 if(r==='calendar-empty')return shell(calendarEmpty(),'calendar');
 if(r==='tools')return shell(tools(),'tools');
 if(r==='features')return shell(features(),'');
 if(r==='account'&&byId(id)){const a=byId(id);
  if(v.mode==='panel')return shell(v.home(),'accounts')+`<aside class="drawer" aria-label="${a.name}"><div class="pad">${detail(a,'panel')}</div></aside>`;
  if(v.mode==='page')return shell(`<div style="max-width:860px;margin:0 auto">${detail(a,'page')}</div>`,'accounts');
  return shell(`<div class="split"><div class="list stack" style="gap:4px;position:sticky;top:84px"><a class="btn ghost sm" href="#accounts" style="align-self:flex-start">${ic('back')}Today</a>${ACC.map(b=>`<a class="mini ${b.id===id?'on':''}" href="#account/${b.id}" style="text-decoration:none"><span><b>${b.name}</b><div class="small muted">${b.stage}</div></span><span class="small muted num">${b.blown?'Blown':money(cushion(b))}</span></a>`).join('')}</div><div>${detail(a,'split')}</div></div>`,'accounts');}
 return shell(v.home(),'accounts');}
function fillLive(){const l=document.getElementById('live');if(l)l.innerHTML=V[current].live();const c=document.getElementById('capnote');if(c)c.textContent=capText();const n=document.getElementById('incn');if(n)n.textContent=`on ${S.inc.size} of ${ACC.length} accounts`;}

const stage=document.getElementById('stage');
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current=0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
function mount(i){stage.innerHTML=page(i);fillLive();toolsCalc();}
function setActive(i){if(i<0||i>=V.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i);}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
window.addEventListener('resize',moveHighlight);
window.addEventListener('hashchange',()=>{mount(current);if(!document.querySelector('.drawer'))scrollTo(0,0)});
document.addEventListener('keydown',e=>{
 if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='Escape'&&route()[0]==='account'){location.hash='accounts';return}
 const num=parseInt(e.key,10);
 if(num>=1&&num<=V.length)setActive(num-1);
 else if(e.key==='ArrowRight')setActive((current+1)%V.length);
 else if(e.key==='ArrowLeft')setActive((current-1+V.length)%V.length);});
stage.addEventListener('input',e=>{if(e.target.id==='slider'){S.x=+e.target.value;document.getElementById('xv').textContent=money(S.x,1);fillLive();}else toolsCalc();});
stage.addEventListener('change',e=>{if(e.target.dataset.inc){const id=e.target.dataset.inc;S.inc.has(id)?S.inc.delete(id):S.inc.add(id);fillLive();}
 if(e.target.id==='firm'){document.getElementById('rules').innerHTML=addRules(e.target.value);document.getElementById('plan').innerHTML=`<option>${FIRMS[e.target.value][0]}</option>`;}});
stage.addEventListener('click',e=>{
 if(e.target.id==='reset'){S.x=0;mount(current);return}
 if(e.target.id==='apply'){S.applied=true;mount(current);return}
 if(e.target.closest('input,button,select,a,label,summary'))return;
 const go=e.target.closest('[data-go]');if(go)location.hash=go.dataset.go;});
const q=new URLSearchParams(location.search);if(q.get('x'))S.x=+q.get('x');if(q.get('applied'))S.applied=true;
setActive((parseInt(q.get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body>
</html>
